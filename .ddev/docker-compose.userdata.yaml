# DDEV mounts the project directory and nothing else, so a storage directory
# beside the checkout would otherwise exist only inside the container — invisible
# from the host and destroyed by `ddev delete`.
#
# Bind the real host directory instead. Course data (rosters, photos, responses)
# then lives at <parent-of-repo>/userData, exactly where the per-course symlinks
# point, and survives rebuilding the containers.
services:
  web:
    volumes:
      - "${DDEV_APPROOT}/../userData:/var/www/userData"
